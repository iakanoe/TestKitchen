# This repository's own CI: the product's tests (tests/, unittest, standard
# library plus PyYAML) on the oldest Python Test Kitchen supports (3.9) and a
# current one. The tests build throwaway git repositories and never use the
# network.
#
# The root `check` job lives in .github/workflows/check.yml, installed by
# init.py when this repository installed Test Kitchen on itself (dogfooding).
# It is a framework file changed only through init.py update, so it stays a
# separate workflow from this product-test job.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.9 is the oldest Python Test Kitchen supports (macOS's bundled python3).
          # setup-python publishes 3.9 builds only for Ubuntu 22.04 and 24.04, not for
          # ubuntu-latest (26.04), so that job pins 24.04. When 24.04 is retired, the
          # supported minimum has to move (or run 3.9 another way).
          - python: "3.9"
            os: ubuntu-24.04
          - python: "3.14"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install PyYAML
        run: python3 -m pip install pyyaml
      - name: Run the tests
        run: python3 -m unittest discover -s tests -v
